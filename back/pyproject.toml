[project]
name = "hcc-cip-backend"
version = "0.6.0"
description = "HCC-CIP V0.6 backend (SQLite local development)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "pydantic==2.13.4",
  "pydantic-settings>=2.6",
  "PyJWT==2.13.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "PyYAML>=6", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
