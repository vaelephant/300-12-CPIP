openapi: 3.1.0
info:
  title: HCC-CIP API
  version: 0.6.0
  description: HCC-CIP V0.6 拟议契约，仅覆盖肝细胞癌（C22.0）首个端到端闭环。不是临床验证或上线许可。
  contact:
    name: HCC-CIP 研发组
servers:
- url: http://127.0.0.1:8000/api/v1
  description: 本地开发
tags:
- name: auth
- name: patients
- name: pathways
- name: enrollment
- name: instances
- name: plans
- name: tasks
- name: variations
- name: followups
- name: outcomes
- name: rules
- name: knowledge
- name: predictions
- name: analytics
- name: audit
- name: system
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Patient:
      $ref: ./schemas/patient.schema.json
    Encounter:
      $ref: ./schemas/encounter.schema.json
    Observation:
      $ref: ./schemas/observation.schema.json
    Snapshot:
      $ref: ./schemas/snapshot.schema.json
    PathwayVersion:
      $ref: ./schemas/pathway_version.schema.json
    EnrollmentEvaluation:
      $ref: ./schemas/enrollment_evaluation.schema.json
    Instance:
      $ref: ./schemas/instance.schema.json
    Plan:
      $ref: ./schemas/plan.schema.json
    Variation:
      $ref: ./schemas/variation.schema.json
    Followup:
      $ref: ./schemas/followup.schema.json
    Outcome:
      $ref: ./schemas/outcome.schema.json
    AuditEvent:
      $ref: ./schemas/audit_event.schema.json
    ErrorResponse:
      $ref: ./schemas/error.schema.json
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - employee_no
      - password
      properties:
        employee_no:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - user_id
      - name
      - role
      - data_scope
      properties:
        user_id:
          type: string
        name:
          type: string
        role:
          type: string
        data_scope:
          enum:
          - OWN
          - DEPT
          - ORG
          - ALL_NO_RECORD
    PageMeta:
      type: object
      required:
      - page
      - page_size
      - total
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    PatientList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ObservationList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
    ClinicalEventImport:
      type: object
      required:
      - source_system
      - events
      properties:
        source_system:
          type: string
        idempotency_key:
          type: string
        events:
          type: array
          items:
            type: object
            additionalProperties: true
    ImportResult:
      type: object
      required:
      - imported
      - duplicates
      - request_id
      properties:
        imported:
          type: integer
        duplicates:
          type: integer
        request_id:
          type: string
    ValidationResult:
      type: object
      required:
      - valid
      - errors
      - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        content_hash:
          type:
          - string
          - 'null'
    EvaluateRequest:
      type: object
      required:
      - patient_id
      - snapshot_id
      - pathway_version_id
      properties:
        patient_id:
          type: string
        snapshot_id:
          type: string
        pathway_version_id:
          type: string
    InstanceCreate:
      type: object
      additionalProperties: false
      required:
      - patient_id
      - pathway_version_id
      - enrollment_evaluation_id
      - doctor_confirmed
      properties:
        patient_id:
          type: string
        pathway_version_id:
          type: string
        enrollment_evaluation_id:
          type: string
        doctor_confirmed:
          type: boolean
        idempotency_key:
          type:
          - string
          - 'null'
    PlanCreate:
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - ruleset_version
      properties:
        snapshot_id:
          type: string
        ruleset_version:
          type: string
        template_plan_id:
          type:
          - string
          - 'null'
    Task:
      type: object
      required:
      - task_id
      - instance_id
      - name
      - status
      properties:
        task_id:
          type: string
        instance_id:
          type: string
        name:
          type: string
        status:
          enum:
          - PENDING
          - READY
          - IN_PROGRESS
          - COMPLETED
          - BLOCKED
          - SKIPPED
          - CANCELLED
    TaskList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    TaskTransitionRequest:
      type: object
      required:
      - to_status
      - expected_version
      properties:
        to_status:
          enum:
          - PENDING
          - READY
          - IN_PROGRESS
          - COMPLETED
          - BLOCKED
          - SKIPPED
          - CANCELLED
        expected_version:
          type: integer
        result_summary:
          type:
          - string
          - 'null'
        source_system:
          type:
          - string
          - 'null'
        idempotency_key:
          type: string
    VariationCreate:
      type: object
      required:
      - instance_id
      - patient_id
      - type
      - severity
      - title
      - description
      properties:
        instance_id:
          type: string
        patient_id:
          type: string
        type:
          enum:
          - CLINICAL
          - TIME
          - SAFETY
          - RESOURCE
          - PROCESS
          - PATIENT
          - DATA
        severity:
          enum:
          - LOW
          - MEDIUM
          - HIGH
        title:
          type: string
        description:
          type: string
        affected_nodes:
          type: array
          items:
            type: string
    FollowupCreate:
      type: object
      required:
      - patient_id
      - window_start
      - window_end
      - channel
      - consent_status
      - owner
      properties:
        patient_id:
          type: string
        instance_id:
          type:
          - string
          - 'null'
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        channel:
          enum:
          - PHONE
          - OUTPATIENT
          - ONLINE
        consent_status:
          enum:
          - GRANTED
          - DECLINED
          - UNKNOWN
        owner:
          type: string
        risk_level:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          default: LOW
    ContactCreate:
      type: object
      required:
      - channel
      - outcome
      properties:
        channel:
          enum:
          - PHONE
          - OUTPATIENT
          - ONLINE
        outcome:
          enum:
          - REACHED
          - NO_ANSWER
          - RESCHEDULED
          - DECLINED
        raw_patient_text:
          type:
          - string
          - 'null'
        structured_extract:
          type:
          - object
          - 'null'
          additionalProperties: true
        confirmed_by_human:
          type: boolean
    OutcomeCreate:
      type: object
      additionalProperties: false
      required:
      - instance_id
      - treatment_type
      - evaluation_standard
      - observed_at
      - recurrence
      - response
      properties:
        instance_id:
          type: string
        treatment_type:
          type: string
        evaluation_standard:
          enum:
          - RECIST
          - mRECIST
        observed_at:
          type: string
          format: date-time
        recurrence:
          enum:
          - NONE
          - LOCAL
          - DISTANT
          - UNKNOWN
        progression:
          type:
          - boolean
          - 'null'
        response:
          enum:
          - CR
          - PR
          - SD
          - PD
          - UNKNOWN
        adverse_events:
          type: array
          items:
            type: object
            additionalProperties: true
        lost_to_followup:
          type: boolean
    RuleEvaluateRequest:
      type: object
      required:
      - rule_id
      - rule_version
      - patient_id
      - snapshot_id
      properties:
        rule_id:
          type: string
        rule_version:
          type: string
        patient_id:
          type: string
        snapshot_id:
          type: string
    RuleEvaluation:
      type: object
      required:
      - rule_id
      - rule_version
      - result
      - missing_fields
      properties:
        rule_id:
          type: string
        rule_version:
          type: string
        result:
          enum:
          - 'TRUE'
          - 'FALSE'
          - UNKNOWN
        missing_fields:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string
    EvidenceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    PredictionRequest:
      type: object
      required:
      - patient_snapshot
      - prediction_target
      - horizon_days
      properties:
        patient_snapshot:
          type: object
        prediction_target:
          type: string
        horizon_days:
          type: integer
    Prediction:
      type: object
      required:
      - model_id
      - model_version
      - prediction_target
      - horizon_days
      - result
      - uncertainty
      - clinical_use
      - model_status
      properties:
        model_id:
          type: string
        model_version:
          type: string
        prediction_target:
          type: string
        horizon_days:
          type: integer
        result:
          type: object
        uncertainty:
          type: object
        clinical_use:
          const: false
        model_status:
          enum:
          - RESEARCH
          - SHADOW
          - VALIDATED
        applicable_population:
          type:
          - string
          - 'null'
    AnalyticsSummary:
      type: object
      required:
      - period
      - metrics
      properties:
        period:
          type: object
        metrics:
          type: array
          items:
            type: object
            additionalProperties: true
    AuditEventList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          const: ok
        version:
          type: string
        database:
          type: string
        external_services:
          type: object
    PatientCreate:
      type: object
      additionalProperties: false
      required:
      - display_name
      - sex
      - source_system
      properties:
        display_name:
          type: string
          maxLength: 64
        sex:
          enum:
          - M
          - F
          - OTHER
          - UNKNOWN
        birth_date:
          type:
          - string
          - 'null'
          format: date
        source_system:
          type: string
          maxLength: 64
        external_id:
          type:
          - string
          - 'null'
          maxLength: 128
        synthetic:
          const: true
          default: true
    SnapshotCreate:
      type: object
      additionalProperties: false
      required:
      - as_of
      - staging
      - liver_reserve
      - performance_status
      - tumor
      - ruleset_version
      properties:
        snapshot_id:
          type:
          - string
          - 'null'
          maxLength: 64
        as_of:
          type: string
          format: date-time
        synthetic:
          const: true
          default: true
        staging:
          type: object
          required:
          - system
          - version
          - value
          properties:
            system:
              enum:
              - CNLC
              - BCLC
            version:
              type: string
            value:
              type: string
        liver_reserve:
          type: object
          required:
          - child_pugh
          properties:
            child_pugh:
              enum:
              - A
              - B
              - C
              - UNKNOWN
            child_pugh_version:
              type:
              - string
              - 'null'
            albi:
              type:
              - number
              - 'null'
        performance_status:
          type: object
          required:
          - ecog
          properties:
            ecog:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 5
        tumor:
          type: object
          required:
          - vascular_invasion
          - extrahepatic_metastasis
          properties:
            max_diameter_mm:
              type:
              - number
              - 'null'
            number:
              type:
              - integer
              - 'null'
            location:
              type:
              - string
              - 'null'
            vascular_invasion:
              type: boolean
            extrahepatic_metastasis:
              type: boolean
        biomarkers:
          type: object
        hepatitis:
          type: object
        treatment_history:
          type: array
          items:
            type: string
        observation_refs:
          type: array
          items:
            type: string
        missing_fields:
          type: array
          items:
            type: string
        ruleset_version:
          type: string
    PathwayGraph:
      type: object
      additionalProperties: false
      required:
      - nodes
      - edges
      properties:
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            additionalProperties: true
    PathwayCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - graph
      - rules
      properties:
        name:
          type: string
          maxLength: 128
        version:
          type: string
          maxLength: 32
          default: 0.1.0
        graph:
          $ref: '#/components/schemas/PathwayGraph'
        rules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
    PathwayVersionCreate:
      type: object
      additionalProperties: false
      required:
      - version
      - graph
      - rules
      properties:
        version:
          type: string
          maxLength: 32
        graph:
          $ref: '#/components/schemas/PathwayGraph'
        rules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
    PathwayListOut:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PathwayVersion'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Approval:
      type: object
      additionalProperties: true
      required:
      - approval_id
      - object_type
      - object_id
      - status
      - requested_by
      - requested_at
      properties:
        approval_id:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        status:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        risk:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        reviewer:
          type:
          - string
          - 'null'
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
        comment:
          type:
          - string
          - 'null'
    ApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        comment:
          type:
          - string
          - 'null'
          maxLength: 2000
    ApprovalListOut:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        meta:
          $ref: '#/components/schemas/PageMeta'
    VariationResolve:
      type: object
      additionalProperties: false
      required:
      - resolution
      properties:
        resolution:
          type: string
          maxLength: 2000
        close:
          type: boolean
          default: false
    EscalationRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 1000
    CloseRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 1000
    SpecialtyAssessment:
      type: object
      additionalProperties: false
      required:
      - assessment_id
      - patient_id
      - snapshot_id
      - as_of
      - staging
      - liver_reserve
      - performance_status
      - tumor
      - missing_fields
      - ruleset_version
      properties:
        assessment_id:
          type: string
        patient_id:
          type: string
        snapshot_id:
          type: string
        as_of:
          type: string
          format: date-time
        staging:
          type: object
          additionalProperties: true
        liver_reserve:
          type: object
          additionalProperties: true
        performance_status:
          type: object
          additionalProperties: true
        tumor:
          type: object
          additionalProperties: true
        biomarkers:
          type: object
          additionalProperties: true
        hepatitis:
          type: object
          additionalProperties: true
        treatment_history:
          type: array
          items:
            type: string
        missing_fields:
          type: array
          items:
            type: string
        ruleset_version:
          type: string
    PatientOverview:
      type: object
      additionalProperties: false
      required:
      - patient_id
      - display_name
      - sex
      - diagnosis_code
      - diagnosis_name
      - risk_level
      - status
      - scenario
      - progress
      properties:
        patient_id:
          type: string
        display_name:
          type: string
        external_id:
          type:
          - string
          - 'null'
        sex:
          type: string
        birth_date:
          type:
          - string
          - 'null'
          format: date
        age:
          type:
          - integer
          - 'null'
        department_name:
          type:
          - string
          - 'null'
        ward:
          type:
          - string
          - 'null'
        bed:
          type:
          - string
          - 'null'
        attending:
          type:
          - string
          - 'null'
        diagnosis_code:
          type: string
        diagnosis_name:
          type: string
        stage:
          type:
          - string
          - 'null'
        risk_level:
          type: string
        status:
          type: string
        scenario:
          type: string
        pathway_id:
          type:
          - string
          - 'null'
        pathway_name:
          type:
          - string
          - 'null'
        pathway_version:
          type:
          - string
          - 'null'
        instance_id:
          type:
          - string
          - 'null'
        enrolled_at:
          type:
          - string
          - 'null'
          format: date-time
        admitted_at:
          type:
          - string
          - 'null'
          format: date-time
        los:
          type:
          - integer
          - 'null'
        progress:
          type: integer
        current_stage:
          type:
          - string
          - 'null'
        data_completeness:
          type:
          - integer
          - 'null'
        missing_fields:
          type: array
          items:
            type: string
        flags:
          type: array
          items:
            type: string
    PatientOverviewList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientOverview'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PatientDetail:
      type: object
      required:
      - patient
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        encounters:
          type: array
          items:
            $ref: '#/components/schemas/Encounter'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        assessment:
          oneOf:
          - $ref: '#/components/schemas/SpecialtyAssessment'
          - type: 'null'
        instance:
          oneOf:
          - $ref: '#/components/schemas/Instance'
          - type: 'null'
        plan:
          oneOf:
          - $ref: '#/components/schemas/Plan'
          - type: 'null'
        variations:
          type: array
          items:
            $ref: '#/components/schemas/Variation'
        followups:
          type: array
          items:
            $ref: '#/components/schemas/Followup'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
    PathwayOverview:
      type: object
      additionalProperties: false
      required:
      - template_id
      - name
      - disease_code
      - instance_count
      - version_count
      - node_count
      properties:
        template_id:
          type: string
        name:
          type: string
        disease_code:
          type: string
        department_name:
          type:
          - string
          - 'null'
        current_version_id:
          type:
          - string
          - 'null'
        current_version:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        owner_name:
          type:
          - string
          - 'null'
        instance_count:
          type: integer
        version_count:
          type: integer
        node_count:
          type: integer
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    PathwayOverviewList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PathwayOverview'
        meta:
          $ref: '#/components/schemas/PageMeta'
    TaskOverview:
      type: object
      additionalProperties: false
      required:
      - task_id
      - instance_id
      - patient_id
      - node_key
      - name
      - stage
      - role
      - status
      - required
      - overdue
      - version
      properties:
        task_id:
          type: string
        instance_id:
          type: string
        patient_id:
          type: string
        patient_name:
          type:
          - string
          - 'null'
        pathway_name:
          type:
          - string
          - 'null'
        node_key:
          type: string
        name:
          type: string
        stage:
          type: string
        role:
          type: string
        status:
          type: string
        required:
          type: boolean
        assignee:
          type:
          - string
          - 'null'
        due_at:
          type:
          - string
          - 'null'
          format: date-time
        overdue:
          type: boolean
        version:
          type: integer
        dependencies_completed:
          type: boolean
          default: true
    TaskOverviewList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskOverview'
        meta:
          $ref: '#/components/schemas/PageMeta'
    FollowupAlert:
      type: object
      additionalProperties: true
      required:
      - alert_id
      - followup_id
      - patient_id
      - risk_level
      - reason
      - status
      - channel
      - created_at
      properties:
        alert_id:
          type: string
        followup_id:
          type: string
        patient_id:
          type: string
        risk_level:
          type: string
        reason:
          type: string
        status:
          enum:
          - OPEN
          - NOTIFICATION_PENDING
          - NOTIFIED
          - ACKNOWLEDGED
          - IN_ACTION
          - RESOLVED
          - CLOSED
        channel:
          type: string
        created_at:
          type: string
          format: date-time
        notified_at:
          type:
          - string
          - 'null'
          format: date-time
        acknowledged_by:
          type:
          - string
          - 'null'
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
        resolution:
          type:
          - string
          - 'null'
    FollowupAlertList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowupAlert'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AlertResolve:
      type: object
      additionalProperties: false
      required:
      - resolution
      properties:
        resolution:
          type: string
          maxLength: 2000
    AlertClose:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 2000
    Reassessment:
      type: object
      additionalProperties: false
      required:
      - reassessment_id
      - patient_id
      - instance_id
      - trigger_type
      - reason
      - status
      - created_at
      properties:
        reassessment_id:
          type: string
        patient_id:
          type: string
        instance_id:
          type: string
        event_id:
          type:
          - string
          - 'null'
        trigger_type:
          type: string
        reason:
          type: string
        status:
          enum:
          - OPEN
          - REPLAN_DRAFTED
          - DISMISSED
          - RESOLVED
        plan_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
    ReassessmentList:
      type: object
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reassessment'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ReassessmentDismiss:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 2000
